<div class="main-content">
  <div class="section-content section-content-p30">
    <h4>Category: {{ currentCategoryName }}</h4>
    <hr>
    <div class="container-fluid">
      <div class="row">

        @for (tempProduct of products; track tempProduct.id) {
          <div class="col-md-3">
            <div class="product-box">

              <a (click)="openProductDetails(tempProduct)">
                <img [src]="tempProduct.imageUrl" class="img-fluid" [alt]="'Image of ' + tempProduct.name" />
              </a>

              <a (click)="openProductDetails(tempProduct)">
                <h1>{{ tempProduct.name }}</h1>
              </a>

              <div class="row align-items-center">
                <div class="price col-6">{{ tempProduct.unitPrice | currency:'BRL' }}</div>
                <!-- <button (click)="addToCart(tempProduct)" class="btn btn-primary btn-sm">Add to cart</button> -->
                <div class="col-3"></div>
                <div class="col-2" (click)="addToCart(tempProduct)">
                  <div class="card-button">
                    <svg class="svg-icon" viewBox="0 0 20 20">
                      <path d="M17.72,5.011H8.026c-0.271,0-0.49,0.219-0.49,0.489c0,0.271,0.219,0.489,0.49,0.489h8.962l-1.979,4.773H6.763L4.935,5.343C4.926,5.316,4.897,5.309,4.884,5.286c-0.011-0.024,0-0.051-0.017-0.074C4.833,5.166,4.025,4.081,2.33,3.908C2.068,3.883,1.822,4.075,1.795,4.344C1.767,4.612,1.962,4.853,2.231,4.88c1.143,0.118,1.703,0.738,1.808,0.866l1.91,5.661c0.066,0.199,0.252,0.333,0.463,0.333h8.924c0.116,0,0.22-0.053,0.308-0.128c0.027-0.023,0.042-0.048,0.063-0.076c0.026-0.034,0.063-0.058,0.08-0.099l2.384-5.75c0.062-0.151,0.046-0.323-0.045-0.458C18.036,5.092,17.883,5.011,17.72,5.011z"></path>
                      <path d="M8.251,12.386c-1.023,0-1.856,0.834-1.856,1.856s0.833,1.853,1.856,1.853c1.021,0,1.853-0.83,1.853-1.853S9.273,12.386,8.251,12.386z M8.251,15.116c-0.484,0-0.877-0.393-0.877-0.874c0-0.484,0.394-0.878,0.877-0.878c0.482,0,0.875,0.394,0.875,0.878C9.126,14.724,8.733,15.116,8.251,15.116z"></path>
                      <path d="M13.972,12.386c-1.022,0-1.855,0.834-1.855,1.856s0.833,1.853,1.855,1.853s1.854-0.83,1.854-1.853S14.994,12.386,13.972,12.386z M13.972,15.116c-0.484,0-0.878-0.393-0.878-0.874c0-0.484,0.394-0.878,0.878-0.878c0.482,0,0.875,0.394,0.875,0.878C14.847,14.724,14.454,15.116,13.972,15.116z"></path>
                    </svg>
                  </div>
                </div>
              </div>
            </div>
          </div>
        }

        @empty {
          <div class="alert alert-warning col-md-12" role="alert">
            No products found.
          </div>
        }
      </div>

      <div class="footer-pagination mt-4">
        <div class="row align-items-center">
          <div class="col-md-6"></div>

          <div class="col-md-6">
            <div class="row align-items-center">
              <div class="col-md-9 d-flex justify-content-end">
                <ngb-pagination
                  [(page)]="thePageNumber"
                  [pageSize]="thePageSize"
                  [collectionSize]="theTotalElements"
                  [maxSize]="5"
                  [boundaryLinks]="true"
                  (pageChange)="listProducts()">
                </ngb-pagination>
              </div>

              <div class="col-md-3 text-end d-flex align-items-center justify-content-end">
                <span class="me-2">Page Size</span>
                <select #myPageSelect (change)="updatePageSize(myPageSelect.value)">
                  <option [value]="5" [selected]="thePageSize === 5">5</option>
                  <option [value]="10" [selected]="thePageSize === 10">10</option>
                  <option [value]="20" [selected]="thePageSize === 20">20</option>
                  <option [value]="30" [selected]="thePageSize === 30">30</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>
      </div>
  </div>
</div>
